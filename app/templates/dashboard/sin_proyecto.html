{% extends 'base.html' %}
{% block title %}Sin proyecto{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-building-slash display-1 text-naranja"></i>
  <h2 class="mt-3">Aún no tienes acceso a ninguna obra</h2>
  <p class="text-muted">Pide al administrador que te asigne un proyecto.</p>
  {% if current_user.es_admin %}
  <a class="btn btn-naranja mt-2" href="{{ url_for('proyectos.nuevo') }}"><i class="bi bi-plus-lg"></i> Crear un proyecto</a>
  {% endif %}
</div>
{% endblock %}
